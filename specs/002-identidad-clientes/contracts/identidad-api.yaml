components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password, acceptsPrivacyPolicy]
      properties:
        fullName:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        acceptsPrivacyPolicy:
          type: boolean

    ConfirmEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginMfaRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[a-fA-F0-9]{64}$'
        code:
          type: string
          description: Código TOTP de seis dígitos o código de recuperación en cuatro grupos de ocho caracteres hexadecimales.
          pattern: '^(?:[0-9]{6}|(?:[A-Fa-f0-9]{8}-){3}[A-Fa-f0-9]{8})$'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshTokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    LoginChallengeResponse:
      type: object
      required: [mfaRequired, challengeToken, expiresIn]
      properties:
        mfaRequired:
          type: boolean
          enum: [true]
        challengeToken:
          type: string
        expiresIn:
          type: integer
          description: Duración del desafío en segundos.

    MfaEnrollmentChallengeResponse:
      type: object
      required: [mfaSetupRequired, enrollmentToken, expiresIn]
      properties:
        mfaSetupRequired:
          type: boolean
          enum: [true]
        enrollmentToken:
          type: string
          minLength: 64
          maxLength: 64
        expiresIn:
          type: integer
          description: Duración del desafío de inscripción en segundos.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 128
          minLength: 12

    MfaSetupResponse:
      type: object
      required: [qrCodeUrl, status]
      properties:
        qrCodeUrl:
          type: string
          format: uri
          description: URI de aprovisionamiento TOTP para registrar la cuenta en la aplicación autenticadora.
        status:
          type: string
          enum: [pending_activation]

    MfaVerifyResponse:
      type: object
      required: [status, recoveryCodes]
      properties:
        status:
          type: string
          enum: [active]
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Códigos de recuperación de un solo uso. Se entregan una sola vez tras activar MFA.
          items:
            type: string

    MfaVerifyRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'

    MfaEnrollmentTokenRequest:
      type: object
      required: [enrollmentToken]
      properties:
        enrollmentToken:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[a-fA-F0-9]{64}$'

    MfaEnrollmentVerifyRequest:
      type: object
      required: [enrollmentToken, code]
      properties:
        enrollmentToken:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[a-fA-F0-9]{64}$'
        code:
          type: string
          pattern: '^[0-9]{6}$'

    MfaDisableRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
          maxLength: 128
        code:
          type: string
          description: Código TOTP de seis dígitos o código de recuperación.
          pattern: '^(?:[0-9]{6}|(?:[A-Fa-f0-9]{8}-){3}[A-Fa-f0-9]{8})$'

    MfaRecoveryCodesRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Código TOTP de seis dígitos o código de recuperación.
          pattern: '^(?:[0-9]{6}|(?:[A-Fa-f0-9]{8}-){3}[A-Fa-f0-9]{8})$'

    MfaRecoveryCodesResponse:
      type: object
      required: [status, recoveryCodes]
      properties:
        status:
          type: string
          enum: [active]
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Los códigos nuevos se entregan una sola vez; sus hashes son los únicos datos almacenados.
          items:
            type: string

    EmailChangeRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail:
          type: string
          format: email

    EmailChangeConfirmationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ReauthRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        preferences:
          type: object
          additionalProperties: true

    ProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        preferences:
          type: object
          additionalProperties: true

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12

    SessionResponse:
      type: object
      properties:
        id:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isActive:
          type: boolean

    ConsentResponse:
      type: object
      properties:
        purpose:
          type: string
        state:
          type: string
          enum: [granted, revoked]
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
          nullable: true

    ConsentUpdateRequest:
      type: object
      required: [purpose, granted]
      properties:
        purpose:
          type: string
        granted:
          type: boolean

    PrivacyPolicyResponse:
      type: object
      properties:
        dataPoints:
          type: array
          items:
            type: string
        purposes:
          type: array
          items:
            type: string
        retention:
          type: string

    RequestAcceptedResponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
        message:
          type: string

    StaffMemberResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string

    CreateStaffRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [staff, admin]

    CustomerOrderSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        total:
          type: number
        createdAt:
          type: string
          format: date-time

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    GenericMessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
