openapi: 3.0.3
info:
  title: Identidad y gestión de clientes API
  version: 1.0.0
  description: Contrato HTTP del módulo de identidad para clientes, personal y administración.
servers:
  - url: http://localhost:3001
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar una nueva cuenta de cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Respuesta neutral para no revelar si la cuenta existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Datos inválidos o política de privacidad no aceptada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos de registro desde la misma fuente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/confirm-email:
    post:
      tags: [Auth]
      summary: Confirmar correo con token temporal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
      responses:
        '200':
          description: Correo confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Token inválido, usado o caducado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Devuelve tokens para clientes sin MFA, un desafío temporal para cuentas con MFA o un desafío de inscripción para staff/admin que aún no lo haya activado.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/LoginChallengeResponse'
                  - $ref: '#/components/schemas/MfaEnrollmentChallengeResponse'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos de inicio de sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login/mfa:
    post:
      tags: [Auth]
      summary: Completar el inicio de sesión con un código TOTP o un código de recuperación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
      responses:
        '200':
          description: Inicio de sesión completado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Código inválido, ya utilizado o desafío caducado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: La sesión no está autorizada para este challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos de TOTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token usando refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Access token renovado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Refresh token inválido, caducado o revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Token rotado o ya usado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión actual
      description: Requiere un access token JWT válido. La operación es idempotente y revoca la sesión y todos sus refresh tokens activos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada correctamente; la respuesta no incluye tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Solicitar recuperación de contraseña
      description: Normaliza el correo; solo cuentas activas con correo verificado generan un token. Responde con el mismo mensaje para cuentas inexistentes o no elegibles. Los tokens aleatorios expiran en 30 minutos, se almacenan solo mediante SHA-256 y el endpoint está limitado a cinco solicitudes por minuto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Respuesta neutral para no revelar si la cuenta existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '429':
          description: Demasiadas solicitudes en poco tiempo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Correo inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Restablecer contraseña con token temporal
      description: Consume el token de forma condicional y, en una transacción, actualiza la contraseña, invalida otros tokens de recuperación y revoca todas las sesiones y refresh tokens de la cuenta. El endpoint está limitado a cinco solicitudes por minuto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Token inválido, usado o caducado, o datos de entrada inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas solicitudes en poco tiempo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Preparar MFA TOTP
      description: Requiere JWT. La URI otpauth se devuelve únicamente para registrar el autenticador; el secreto no se expone aparte, se guarda cifrado y no se registra. MFA queda pendiente hasta verificar un TOTP.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Se prepara la configuración MFA y se devuelve la URI de aprovisionamiento TOTP para registrar la cuenta en una aplicación autenticadora. El secreto se almacena cifrado en el servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '400':
          description: MFA ya activo o configuración inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Usuario no autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas solicitudes de configuración MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verificar el código TOTP del usuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA verificado y activado. Los códigos de recuperación se entregan una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaVerifyResponse'
        '400':
          description: Código no válido o temporalmente no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/enrollment/setup:
    post:
      tags: [Auth]
      summary: Preparar MFA obligatorio para staff/admin
      description: Usa un enrollmentToken de cinco minutos devuelto por login cuando una cuenta staff/admin aún no tiene MFA. No requiere ni concede una sesión autenticada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentTokenRequest'
      responses:
        '200':
          description: URI otpauth para registrar el autenticador; el secreto queda cifrado en el servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
        '400':
          description: Desafío de inscripción inválido, utilizado o vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas solicitudes de configuración MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/enrollment/verify:
    post:
      tags: [Auth]
      summary: Activar MFA obligatorio para staff/admin
      description: Verifica un TOTP y consume el desafío de inscripción. La respuesta incluye códigos de recuperación que solo se muestran una vez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentVerifyRequest'
      responses:
        '200':
          description: MFA activado y códigos de recuperación entregados una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaVerifyResponse'
        '400':
          description: Código TOTP inválido o desafío de inscripción inválido, usado o vencido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiados intentos de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Desactivar MFA
      description: Requiere JWT, contraseña y un TOTP o código de recuperación válido. La operación revoca las sesiones y refresh tokens activos de la cuenta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      responses:
        '200':
          description: MFA desactivado; no se devuelven credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: MFA ya no está activo o el segundo factor no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT, contraseña o estado de la cuenta no válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas solicitudes de MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      summary: Regenerar códigos de recuperación MFA
      description: Requiere JWT y un segundo factor válido. Invalida los códigos anteriores; los nuevos solo se muestran una vez y se guardan como hashes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRecoveryCodesRequest'
      responses:
        '200':
          description: Nuevos códigos de recuperación de un solo uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodesResponse'
        '400':
          description: El segundo factor no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT inválido o MFA no activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas solicitudes de MFA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags: [Profile]
      summary: Obtener el perfil autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Profile]
      summary: Editar perfil del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/email:
    post:
      tags: [Profile]
      summary: Solicitar cambio de correo electrónico
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '200':
          description: Cambio solicitado y validado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Correo inválido o duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El nuevo correo ya está asociado a otra cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/email/confirm:
    post:
      tags: [Profile]
      summary: Confirmar el cambio de correo electrónico
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmationRequest'
      responses:
        '200':
          description: Cambio de correo confirmado y aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: Token inválido, usado o caducado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/password:
    post:
      tags: [Profile]
      summary: Cambiar la contraseña del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '400':
          description: La contraseña nueva no cumple las reglas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/orders:
    get:
      tags: [Orders]
      summary: Consultar el historial de pedidos del cliente
      description: El módulo de identidad no accede directamente a tablas de pedidos; consulta a través de interfaz pública del módulo de pedidos o de un servicio expuesto.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos del cliente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrderSummaryResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/sessions:
    get:
      tags: [Profile]
      summary: Listar sesiones activas del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de sesiones activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/sessions/revoke-all:
    post:
      tags: [Profile]
      summary: Revocar todas las sesiones del usuario actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas las sesiones revocadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/sessions/{sessionId}/revoke:
    post:
      tags: [Profile]
      summary: Revocar una sesión concreta
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sesión revocada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sesión no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/consents:
    get:
      tags: [Privacy]
      summary: Consultar consentimientos del usuario
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial actual y vigente de consentimientos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Privacy]
      summary: Registrar o revocar consentimiento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
      responses:
        '200':
          description: Consentimiento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/privacy:
    get:
      tags: [Privacy]
      summary: Mostrar la información de tratamiento y retención
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inventario de datos personales y fines del tratamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPolicyResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/data-export:
    post:
      tags: [Privacy]
      summary: Solicitar exportación de datos personales
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Solicitud creada para exportación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAcceptedResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/delete-account:
    post:
      tags: [Privacy]
      summary: Solicitar eliminación de la cuenta
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Solicitud creada con validación adicional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAcceptedResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Hay un pedido en curso o la operación ya está en proceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/delete-account/re-auth:
    post:
      tags: [Privacy]
      summary: Reautenticación previa antes de confirmar la eliminación de la cuenta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Reautenticación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageResponse'
        '401':
          description: Credenciales no válidas para la reautenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene permiso para confirmar la eliminación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/staff:
